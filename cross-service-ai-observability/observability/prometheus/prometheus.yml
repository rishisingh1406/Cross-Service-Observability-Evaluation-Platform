global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "gateway"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "gateway:8000"

  - job_name: "agent"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "agent:8001"

  - job_name: "retrieval"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "retrieval:8002"

  - job_name: "memory"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "memory:8003"

  - job_name: "llm"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "llm:8004"

  - job_name: "otel-collector"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "otel-collector:8888"
