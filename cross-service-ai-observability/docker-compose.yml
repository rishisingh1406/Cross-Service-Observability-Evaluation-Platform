services:

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: observability-gateway
    ports:
      - "8010:8000"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      - otel-collector
      - agent
    networks:
      - observability-net

  agent:
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    container_name: observability-agent
    ports:
      - "8011:8001"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      - otel-collector
      - retrieval
      - memory
      - llm
    networks:
      - observability-net

  retrieval:
    build:
      context: .
      dockerfile: services/retrieval/Dockerfile
    container_name: observability-retrieval
    ports:
      - "8012:8002"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      - otel-collector
    networks:
      - observability-net

  memory:
    build:
      context: .
      dockerfile: services/memory/Dockerfile
    container_name: observability-memory
    ports:
      - "8013:8003"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      MEMORY_DB_PATH: /data/memory.db
    volumes:
      - memory-data:/data
    depends_on:
      - otel-collector
    networks:
      - observability-net

  llm:
    build:
      context: .
      dockerfile: services/llm/Dockerfile
    container_name: observability-llm
    ports:
      - "8014:8004"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      - otel-collector
    networks:
      - observability-net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: observability-otel-collector
    command:
      - "--config=/etc/otelcol-contrib/otel-collector-config.yaml"
    volumes:
      - ./observability/otel-collector/otel-collector-config.yaml:/etc/otelcol-contrib/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"
    depends_on:
      - jaeger
    networks:
      - observability-net

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: observability-jaeger
    ports:
      - "16686:16686"
    networks:
      - observability-net

networks:
  observability-net:
    driver: bridge

volumes:
  memory-data: