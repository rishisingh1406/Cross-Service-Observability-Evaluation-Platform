name: Evaluation Regression Gate

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  evaluation:
    name: Run Evaluation Regression Gate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: cross-service-ai-observability

    steps:
      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Python
      # ------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            cross-service-ai-observability/services/agent/requirements.txt
            cross-service-ai-observability/services/retrieval/requirements.txt
            cross-service-ai-observability/services/gateway/requirements.txt
            cross-service-ai-observability/services/llm/requirements.txt
            cross-service-ai-observability/services/memory/requirements.txt

      # ------------------------------------------------------
      # Install evaluation dependencies
      # ------------------------------------------------------

      - name: Install evaluation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Install service dependencies
        run: |
          python -m pip install -r services/agent/requirements.txt
          python -m pip install -r services/retrieval/requirements.txt
          python -m pip install -r services/gateway/requirements.txt
          python -m pip install -r services/llm/requirements.txt
          python -m pip install -r services/memory/requirements.txt

      # ------------------------------------------------------
      # Run evaluation
      # ------------------------------------------------------

      - name: Run evaluation suite
        run: |
          python evals/run_eval.py

      # ------------------------------------------------------
      # Regression gate
      # ------------------------------------------------------

      - name: Check evaluation regression
        working-directory: .
        run: |
          python scripts/check_regression.py \
            --baseline cross-service-ai-observability/evals/baseline.json \
            --current cross-service-ai-observability/evals/results.json \
            --config config/regression_thresholds.json